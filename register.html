<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Register | Rutul Motors</title>


    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;

            font-family:
                "Segoe UI",
                Arial,
                sans-serif;
        }


        body {

            min-height: 100vh;

            display: flex;

            align-items: center;

            justify-content: center;

            background:
                linear-gradient(
                    rgba(0,0,0,.65),
                    rgba(0,0,0,.65)
                ),
                url("images/trucks.jpg");

            background-size: cover;

            background-position: center;

            padding: 20px;
        }


        .register-card {

            width: 430px;

            padding: 40px;

            background:
                rgba(255,255,255,.97);

            border-radius: 20px;

            box-shadow:
                0 20px 50px
                rgba(0,0,0,.35);
        }


        .logo {

            text-align: center;

            font-size: 30px;

            font-weight: 800;

            color: #111b2b;

            margin-bottom: 8px;
        }


        .logo span {

            color: #ff9800;
        }


        .subtitle {

            text-align: center;

            color: #777;

            margin-bottom: 30px;
        }


        .form-group {

            margin-bottom: 20px;
        }


        label {

            display: block;

            margin-bottom: 7px;

            font-weight: 600;

            color: #333;
        }


        input {

            width: 100%;

            padding: 13px 15px;

            border:
                1px solid #ddd;

            border-radius: 10px;

            font-size: 15px;

            outline: none;
        }


        input:focus {

            border-color: #ff9800;

            box-shadow:
                0 0 0 3px
                rgba(255,152,0,.12);
        }


        .register-btn {

            width: 100%;

            padding: 14px;

            border: none;

            border-radius: 10px;

            background:
                linear-gradient(
                    135deg,
                    #ff9800,
                    #ffb300
                );

            color: #111;

            font-size: 16px;

            font-weight: 700;

            cursor: pointer;

            transition: .2s;
        }


        .register-btn:hover {

            transform:
                translateY(-2px);
        }


        .links {

            text-align: center;

            margin-top: 25px;

            line-height: 1.8;
        }


        .links a {

            color: #ff8c00;

            text-decoration: none;

            font-weight: 600;
        }


        .back {

            display: block;

            margin-top: 10px;

            color: #666 !important;

            font-weight: 400 !important;
        }

    </style>

</head>


<body>


<div class="register-card">


    <div class="logo">

        RUTUL <span>MOTORS</span>

    </div>


    <p class="subtitle">

        Create your customer account

    </p>


    <form
        action="RegisterServlet"
        method="post">


        <!-- FULL NAME -->

        <div class="form-group">

            <label>
                Full Name
            </label>


            <input
                type="text"
                name="full_name"
                placeholder="Enter your full name"
                maxlength="100"
                required>

        </div>


        <!-- EMAIL -->

        <div class="form-group">

            <label>
                Email
            </label>


            <input
                type="email"
                name="email"
                placeholder="Enter your email"
                maxlength="100"
                required>

        </div>


        <!-- PASSWORD -->

        <div class="form-group">

            <label>
                Password
            </label>


            <input
                type="password"
                name="password"
                placeholder="Create a password"
                maxlength="100"
                required>

        </div>


        <!-- CONFIRM PASSWORD -->

        <div class="form-group">

            <label>
                Confirm Password
            </label>


            <input
                type="password"
                name="confirm_password"
                placeholder="Confirm your password"
                maxlength="100"
                required>

        </div>


        <button
            type="submit"
            class="register-btn">

            Create Account

        </button>


    </form>


    <div class="links">


        <p>

            Already have an account?

            <a href="login.html">

                Login

            </a>

        </p>


        <a
            href="index.jsp"
            class="back">

            ← Back to Home

        </a>


    </div>


</div>


</body>

</html>
