<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Set Up Admin | Rutul Motors</title>
    <link rel="stylesheet" href="polish.css">
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            padding: 28px 18px;
            display: grid;
            place-items: center;
            background:
                radial-gradient(ellipse at 15% 15%, rgba(56, 172, 139, .25), transparent 38%),
                linear-gradient(135deg, #102c32, #173f3b);
            color: #17312f;
            font-family: "Segoe UI", Arial, sans-serif;
        }

        .setup-card {
            width: min(100%, 500px);
            padding: 42px;
            border: 1px solid #dce8e3;
            border-radius: 22px;
            background: #fff;
            box-shadow: 0 24px 70px rgba(0, 0, 0, .25);
        }

        .brand {
            margin-bottom: 26px;
            color: #17312f;
            font-size: 23px;
            font-weight: 900;
            letter-spacing: .04em;
        }

        .brand span {
            color: #f59a18;
        }

        .eyebrow {
            margin: 0 0 8px;
            color: #13725f;
            font-size: 12px;
            font-weight: 800;
            letter-spacing: .12em;
            text-transform: uppercase;
        }

        h1 {
            margin: 0;
            font-size: clamp(27px, 6vw, 34px);
            letter-spacing: -.04em;
        }

        .intro {
            margin: 12px 0 24px;
            color: #68758a;
            line-height: 1.65;
        }

        .notice {
            margin: 0 0 20px;
            padding: 12px 14px;
            border: 1px solid #c4e5d8;
            border-radius: 10px;
            background: #edf8f3;
            color: #155745;
            line-height: 1.5;
        }

        .field {
            margin: 0 0 17px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            color: #334155;
            font-size: 14px;
            font-weight: 700;
        }

        input {
            width: 100%;
            min-height: 48px;
            padding: 12px 14px;
            border: 1px solid #d3e3dc;
            border-radius: 10px;
            background: #f8fbf9;
            color: #17312f;
            font: inherit;
        }

        input:focus {
            border-color: #16836f;
            outline: 3px solid rgba(22, 131, 111, .18);
            background: #fff;
        }

        .hint {
            display: block;
            margin-top: 6px;
            color: #68758a;
            font-size: 12px;
        }

        button {
            width: 100%;
            min-height: 50px;
            margin-top: 5px;
            border: 0;
            border-radius: 10px;
            background: linear-gradient(135deg, #37ad8c, #16836f);
            color: #fff;
            font: inherit;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 8px 18px rgba(22, 131, 111, .2);
        }

        button:hover {
            background: linear-gradient(135deg, #49bd9c, #11745f);
            transform: translateY(-1px);
        }

        .back {
            display: block;
            margin-top: 20px;
            color: #68758a;
            text-align: center;
            text-decoration: none;
        }

        .back:hover {
            color: #13725f;
        }

        @media (max-width: 480px) {
            .setup-card {
                padding: 30px 22px;
            }
        }
    </style>
</head>
<body>
    <main class="setup-card">
        <div class="brand">RUTUL <span>MOTORS</span></div>
        <p class="eyebrow">One-time local setup</p>
        <h1>Create your admin account</h1>
        <p class="intro">This setup is available only from this computer and only until the first admin account is created.</p>
        <p class="notice" id="notice" role="status" hidden></p>

        <form action="AdminSetupServlet" method="post">
            <div class="field">
                <label for="full_name">Full name</label>
                <input id="full_name" name="full_name" type="text" maxlength="100" autocomplete="name" required>
            </div>
            <div class="field">
                <label for="email">Email address</label>
                <input id="email" name="email" type="email" maxlength="100" autocomplete="email" required>
            </div>
            <div class="field">
                <label for="password">Password</label>
                <input id="password" name="password" type="password" minlength="12" maxlength="100" autocomplete="new-password" required>
                <span class="hint">Use at least 12 characters.</span>
            </div>
            <div class="field">
                <label for="confirm_password">Confirm password</label>
                <input id="confirm_password" name="confirm_password" type="password" minlength="12" maxlength="100" autocomplete="new-password" required>
            </div>
            <button type="submit">Create Admin Account</button>
        </form>
        <a class="back" href="login.html">Back to login</a>
    </main>
    <script>
        const messages = {
            invalid: "Check the form, make sure both passwords match, and use at least 12 characters.",
            email: "An account already uses that email. Try another email address.",
            busy: "Another setup request is in progress. Please try again in a moment."
        };
        const code = new URLSearchParams(window.location.search).get("error");
        const notice = document.getElementById("notice");
        if (code && messages[code]) {
            notice.textContent = messages[code];
            notice.hidden = false;
        }
    </script>
</body>
</html>
